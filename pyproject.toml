[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "incubia-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langgraph==1.2.12", "httpx==0.28.1", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
deployment = ["psycopg[binary]==3.2.10", "psycopg_pool==3.2.6"]
knowledge-local = ["fastembed==0.9.0"]
knowledge-drive = [
    "google-auth==2.40.3",
]

[project.scripts]
incubia = "incubia_orchestrator.interfaces.cli.main:main"
incubia-bot = "incubia_orchestrator.interfaces.cli.bot:main"
incubia-tenant = "incubia_orchestrator.interfaces.cli.tenant:main"

[tool.pytest.ini_options]
markers = ["neon: opt-in integration campaign against the isolated E3-H1 Neon branch"]

[tool.hatch.build.targets.wheel]
packages = ["src/incubia_orchestrator"]
